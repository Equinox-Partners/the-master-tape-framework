name: Bug report
description: Report a reproducible framework or validation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private workspace content, credentials, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a sanitized example and the command you ran.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Ruby version, and AI tool if relevant.
    validations:
      required: true
