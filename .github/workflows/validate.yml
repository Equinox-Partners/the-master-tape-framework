name: Validate The Master Tape

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - ruby-version: "2.6"
            os: ubuntu-22.04
          - ruby-version: "3.3"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: ruby scripts/validate.rb
      - run: ruby scripts/resolve_context.rb "Example Project"
